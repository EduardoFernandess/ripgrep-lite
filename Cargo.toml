[package]
name = "ripgrep-lite"
version = "0.1.0"
edition = "2021"
description = "A fast multi-threaded recursive regex file searcher"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
regex = "1"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
